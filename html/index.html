<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Recruitment</title>

    <link id="themeStylesheet" rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="theme-toggle">
    <button id="lightBtn" class="filter-btn">☀️</button>
    <button id="darkBtn" class="filter-btn">🌙</button>
</div>

<div class="container">

    <h1>👥 HR Recruitment System</h1>

    <div class="top-bar">

        <button id="addRequestBtn">
            ➕ Nová pozice
        </button>

        <input
                type="text"
                id="searchInput"
                placeholder="🔎 Hledat pozici, středisko, kandidáta nebo stav..."
        >

    </div>

    <div class="table-toolbar">

        <div class="view-switch">

            <button
                    id="activeBtn"
                    class="active-view"
            >
                📋 Aktivní
            </button>

            <button id="historyBtn">
                🗃️ Historie
            </button>

        </div>

        <div class="hr-legend">
            ↓ Vyplňuje HR
        </div>

    </div>

    <table id="table">

        <thead>
        <tr>
            <th data-sort="CreatedAt">Datum vystavení ↕</th>
            <th data-sort="CreatedByName">Vystavil ↕</th>
            <th data-sort="Department">Středisko ↕</th>
            <th data-sort="PositionName">Název pozice ↕</th>
            <th data-sort="NeededDate">Požadovaný datum nástupu ↕</th>

            <th
                    class="hr-only hr-column"
                    data-sort="WorkerType"
            >
                AG/KMEN ↕
            </th>

            <th
                    class="hr-only hr-column"
                    data-sort="CandidateName"
            >
                Jméno kandidáta ↕
            </th>

            <th
                    class="hr-only hr-column"
                    data-sort="ExpectedStartDate"
            >
                Datum nástupu ↕
            </th>

            <th data-sort="Note">
                Poznámka ↕
            </th>

            <th data-sort="Status">
                Stav ↕
            </th>
        </tr>
        </thead>

        <tbody></tbody>

    </table>

</div>

<div id="modal" class="modal">

    <div class="modal-content">

        <input
                id="id"
                type="hidden"
        >

        <h2 id="modalTitle">
            Náborový požadavek
        </h2>

        <div class="modal-grid">

            <div class="modal-column">

                <label for="department">
                    Středisko
                </label>

                <input
                        id="department"
                        placeholder="Např. Montáž, Lisovna, Svařovna..."
                >

                <label for="positionName">
                    Název pozice
                </label>

                <input
                        id="positionName"
                        placeholder="Např. Operátor výroby"
                >

                <div id="positionsCountContainer">

                    <label for="positionsCount">
                        Počet požadovaných pracovníků
                    </label>

                    <input
                            id="positionsCount"
                            type="number"
                            min="1"
                            value="1"
                    >

                </div>

                <label for="neededDate">
                    Požadovaný datum nástupu
                </label>

                <input
                        id="neededDate"
                        type="date"
                >

                <label for="status">
                    Stav
                </label>

                <select id="status">
                    <option value="NEW">Nový</option>
                    <option value="IN_RECRUITMENT">Probíhá nábor</option>
                    <option value="CANDIDATE_FOUND">Kandidát nalezen</option>
                    <option value="START_CONFIRMED">Nástup potvrzen</option>
                    <option value="COMPLETED">Splněno</option>
                    <option value="CANCELLED">Zrušeno</option>
                </select>

                <label for="note">
                    Poznámka
                </label>

                <textarea
                        id="note"
                        rows="4"
                        placeholder="Poznámka..."
                ></textarea>

            </div>

            <div class="modal-column hr-fields">

                <h3>HR informace</h3>

                <label for="workerType">
                    AG / KMEN
                </label>

                <select id="workerType">
                    <option value="AG">AG</option>
                    <option value="KMEN">KMEN</option>
                </select>

                <label for="candidateName">
                    Jméno kandidáta
                </label>

                <input
                        id="candidateName"
                        placeholder="Jméno kandidáta"
                >

                <label for="expectedStartDate">
                    Datum nástupu
                </label>

                <input
                        id="expectedStartDate"
                        type="date"
                >

            </div>

        </div>

        <div class="modal-actions">

            <button
                    id="saveBtn"
                    onclick="saveRequest()"
            >
                💾 Uložit
            </button>

            <button
                    id="cancelBtn"
                    onclick="closeModal()"
            >
                ❌ Zrušit
            </button>

        </div>

    </div>

</div>

<script type="module" src="../js/app.js"></script>
<script src="../js/theme.js"></script>

</body>
</html>
